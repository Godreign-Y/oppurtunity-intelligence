[project]
name = "opportunity-intel-backend"
version = "0.1.0"
description = "AI Opportunity Intelligence Platform - Career & Engineering Blog Pipeline"
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.11",
    "python-dotenv>=1.0.0",
    "openai>=1.30.0",
    "tenacity>=8.3.0",
    "python-dateutil>=2.9.0",
    "lxml>=5.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
