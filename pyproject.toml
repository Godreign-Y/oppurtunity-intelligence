[project]
name = "redit"
version = "0.3.0"
description = "AI-driven Reddit market intelligence pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.3.0",
    "numpy>=1.26.0",
    "transformers>=4.46.0",
    "torch>=2.5.0",
    "accelerate>=1.1.0",
    "groq>=1.2.0",
    "sqlalchemy>=2.0.49",
    "asyncpg>=0.31.0",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.4",
    "umap-learn>=0.5.6",
    "hdbscan>=0.8.36",
    "scikit-learn>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
redit-api = "redit.main:run"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
